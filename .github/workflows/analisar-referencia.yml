# Analisa um vídeo de referência (Gemini assiste pelo link) e tenta baixar quadros e áudio.
name: Analisar referência
on:
  push:
    branches: [analise-referencia]
    paths: [ref.txt]
permissions:
  contents: write
jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Gemini assiste
        run: |
          export REF_URL="$(head -1 ref.txt)"
          python3 automacao/analisar_ref.py
      - name: Guardar na Release
        if: always()
        run: |
          gh release delete ref-analise -y --cleanup-tag 2>/dev/null || true
          gh release create ref-analise --target analise-referencia --prerelease -t "Análise da referência" -n "Análise automática" saida/* || true
