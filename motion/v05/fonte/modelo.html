    <div id="pq1" class="card pq" style="left:4560px"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#fffdf8" stroke="#16191c" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#16191c"/><circle cx="16" cy="16" r="1.7" fill="#16191c"/><circle cx="12" cy="12" r="1.7" fill="#16191c"/><circle cx="16" cy="8" r="1.7" fill="#16191c"/><circle cx="8" cy="16" r="1.7" fill="#16191c"/></svg><div class="s">sorte</div><div class="x">✕</div></div>

    <!-- CENA 4: a conta, peça por peça -->

<script>
  /*W*/
  const verdes=new Set(["milhão","visualizações","views.","conta.","conta,","conta","inteira.","peça.","cinquenta","vinte","mil"]);
  const vermelhos=new Set(["quatrocentas","vezes.","fevereiro","difícil."]);
  const leg=document.getElementById('legenda');
  W.forEach(([w],i)=>{const s=document.createElement('span');s.id='w'+i;s.textContent=w;if(verdes.has(w))s.className='g';if(vermelhos.has(w))s.className='r';leg.appendChild(s);});
  const T=(i)=>W[i][1];

  const tl=gsap.timeline({paused:true});
  const E='power3.inOut';
  const DUR=32.8;

  // legenda: uma frase por vez (algumas frases curtas juntas)
  const grupo=[0,0,1,1,2,2,3,3,3,4,5]; // frase -> grupo na tela
  const gIni={};W.forEach(([w,t,f])=>{const g=grupo[f];if(gIni[g]===undefined)gIni[g]=t;});
  W.forEach(([w,t,f],i)=>{
    const g=grupo[f];
    tl.set('#w'+i,{display:'none'},0);
    tl.set('#w'+i,{display:'inline-block'},Math.max(0,gIni[g]-0.05));
    tl.fromTo('#w'+i,{opacity:0,y:16},{opacity:1,y:0,duration:0.2,ease:'power3.out'},t);
    if(gIni[g+1]!==undefined) tl.set('#w'+i,{display:'none'},gIni[g+1]-0.06);
  });

  // câmera
  const cam=[[0,0],[3.75,-1920],[15.25,-3840],[19.45,-5760],[25.0,-7680]];
  cam.forEach(([t,x],k)=>{
    if(k>0) tl.to('#world',{x,duration:0.9,ease:E},t);
    const fim=k<cam.length-1?cam[k+1][0]:DUR;
    tl.to('#world',{x:x-40,duration:fim-(t+(k?0.9:0)),ease:'none'},t+(k?0.9:0));
  });

  // ---------- MASCOTE ----------
  tl.to('#guy',{y:-6,duration:0.9,ease:'sine.inOut',yoyo:true,repeat:35},0);
  [1.2,5.1,9.0,12.4,17.0,21.0,24.0,27.2,30.5].forEach(t=>{tl.to('#eyes',{scaleY:0.1,svgOrigin:'760 330',duration:0.07},t);tl.to('#eyes',{scaleY:1,svgOrigin:'760 330',duration:0.09},t+0.08);});
  const braco=(r,t,d=0.5,e='back.out(1.8)')=>tl.to('#arm',{rotation:r,svgOrigin:'865 485',duration:d,ease:e},t);
  tl.set('#arm',{rotation:55,svgOrigin:'865 485'},0);
  braco(-8,0.35); braco(55,3.4,0.5,E);            // aponta o contador
  braco(-14,7.5); braco(55,11.0,0.5,E);           // aponta a balança
  braco(-80,15.55,0.55,'power2.out');              // coça a cabeça
  tl.to('#arm',{rotation:-74,svgOrigin:'865 485',duration:0.14,yoyo:true,repeat:13,ease:'sine.inOut'},16.1);
  tl.to('#head',{rotation:6,svgOrigin:'760 440',duration:0.4,ease:'sine.inOut'},15.6).to('#head',{rotation:0,svgOrigin:'760 440',duration:0.4},18.6);
  braco(-8,18.75,0.5);                              // "conta!" aponta
  braco(55,21.0,0.5,E);
  braco(-8,23.35); braco(55,25.6,0.5,E);           // aponta a fórmula
  braco(-14,27.8); braco(55,30.0,0.5,E);           // aponta o calendário
  // sobrancelhas / espanto
  tl.to('#sobr',{y:-12,duration:0.18},13.75).to('#sobr',{y:0,duration:0.3},15.0);
  tl.to('#sobr',{y:6,duration:0.25},15.6).to('#sobr',{y:0,duration:0.25},18.6);
  tl.to('#sobr',{y:-12,duration:0.18},19.05).to('#sobr',{y:0,duration:0.3},20.0);
  tl.fromTo('#sweat',{opacity:0,y:-10},{opacity:1,y:10,duration:0.6},30.9);
  // boca no ritmo da fala
  const fala=[[0.21,2.44],[2.86,3.59],[3.97,8.06],[8.52,10.62],[11.18,12.16],[12.67,19.32],[19.64,22.56],[22.88,24.84],[25.26,26.04],[26.42,31.92]];
  fala.forEach(([a,b])=>{let k=0;for(let t=a;t<b;t+=0.13,k++){const m=['m1','m2','m1','m0'][k%4];['m0','m1','m2','m3'].forEach(x=>tl.set('#'+x,{opacity:x===m?1:0},t));}
    ['m1','m2','m3'].forEach(x=>tl.set('#'+x,{opacity:0},b));tl.set('#m0',{opacity:1},b);});
  [[13.79,14.2],[14.94,15.2]].forEach(([a])=>{['m0','m1','m2'].forEach(x=>tl.set('#'+x,{opacity:0},a+0.001));tl.set('#m3',{opacity:1},a+0.001);});

  // ---------- CENA 1: contador ----------
  tl.from('#cont',{scale:0.85,opacity:0,duration:0.45,ease:'back.out(1.7)'},0.05);
  const cnt={v:0};const num=document.getElementById('num');
  const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  tl.to(cnt,{v:1000000,duration:2.1,ease:'power2.in',onUpdate:()=>{num.textContent=fmt(cnt.v);}},0.3);
  tl.set(cnt,{v:1000000,onComplete:()=>{num.textContent='1.000.000';}},2.41);
  tl.to('#num',{color:'#149a55',scale:1.06,duration:0.15,yoyo:true,repeat:1},2.4);
  tl.from('#quanto',{y:40,opacity:0,scale:0.7,duration:0.4,ease:'back.out(2)'},2.86);
  tl.to('#quanto',{rotation:-3,duration:0.12,yoyo:true,repeat:3},3.38);

  // ---------- CENA 2: balança ----------
  tl.from('#bal',{y:60,opacity:0,duration:0.5,ease:'power3.out'},4.0);
  tl.from('#fonte2',{opacity:0,y:12,duration:0.4},4.6);
  tl.to('#fonte2',{color:'#149a55',duration:0.3},4.77).to('#fonte2',{color:'#5c574e',duration:0.4},6.4);
  tl.from('#coins',{y:-120,opacity:0,duration:0.4,ease:'bounce.out'},7.55);
  tl.to('#tL',{opacity:1,duration:0.25},7.62);
  tl.from('#bills',{y:-160,opacity:0,duration:0.45,ease:'bounce.out'},9.9);
  tl.to('#tR',{opacity:1,duration:0.25},9.94);
  // inclina para o lado do R$ 20.000
  const tilt=(a,t,d,e)=>{const dy=410*Math.sin(a*Math.PI/180);
    tl.to('#beam',{rotation:a,svgOrigin:'550 141',duration:d,ease:e},t);
    tl.to('#panL',{y:-dy,duration:d,ease:e},t);tl.to('#panR',{y:dy,duration:d,ease:e},t);};
  tilt(-3,7.7,0.5,'back.out(2)');      // 50 reais mexe pouco
  tilt(9,10.15,0.7,'back.out(1.6)');   // 20 mil desce
  tl.from(['#vL','#vR'],{opacity:0,y:14,duration:0.35,stagger:0.25},11.2);
  tl.to(['#vL','#vR'],{color:'#16191c',duration:0.2},11.9);
  tl.fromTo('#stamp',{scale:2.4,opacity:0},{scale:1,opacity:1,duration:0.22,ease:'power4.in'},13.6);
  tl.to('#bal',{x:-8,duration:0.05,yoyo:true,repeat:3},13.82);

  // ---------- CENA 3: sorte? algoritmo? conta ----------
  tl.fromTo('#balao',{opacity:0,scale:0.6,transformOrigin:'25% 100%'},{opacity:1,scale:1,duration:0.35,ease:'back.out(2)'},16.0);
  tl.from('#pq1',{y:60,opacity:0,duration:0.45,ease:'back.out(1.6)'},16.05);
  tl.from('#pq2',{y:60,opacity:0,duration:0.45,ease:'back.out(1.6)'},16.75);
  tl.to('#pq1 .x',{opacity:1,duration:0.1},18.6);
  tl.to('#pq1',{rotation:-5,y:16,opacity:0.5,duration:0.3,ease:'power2.in'},18.62);
  tl.to('#pq2 .x',{opacity:1,duration:0.1},18.72);
  tl.to('#pq2',{rotation:5,y:16,opacity:0.5,duration:0.3,ease:'power2.in'},18.74);
  tl.to('#risco',{scaleX:1,rotation:-6,duration:0.25,ease:'power2.out'},18.6);
  tl.to(['#bt1','#risco'],{opacity:0,duration:0.15},19.0);
  tl.to('#bt2',{opacity:1,duration:0.15},19.05);
