<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Thumbnail v01</title>
<!-- Thumbnail do vídeo 1 (1920x1080, reduzida para 1280x720). seek(t): t=0 -> opção A, t=1 -> opção B. -->
<style>
  :root { --bg:#0e1114; --surface:#171b21; --line:#2a3038; --text:#f2f4f6; --muted:#8a939e; --accent:#22e07a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  .op { position: absolute; inset: 0; display: none; }
  .disp { font-family: "Bahnschrift", sans-serif; font-weight: 700; font-stretch: condensed;
          font-variation-settings: "wght" 700, "wdth" 75; line-height: 0.86; color: var(--text); white-space: nowrap; }
  .ui { font-family: "Segoe UI", sans-serif; font-weight: 800; color: var(--muted); }
  .ac { color: var(--accent); }
  .abs { position: absolute; }
</style></head>
<body><div id="stage">

  <!-- Opção A: "70" gigante + gráfico achatado + mascote -->
  <div class="op" id="A">
    <div class="abs" style="left:-120px;top:-200px;width:1300px;height:1300px;border-radius:50%;background:radial-gradient(circle, #13261d 0%, transparent 65%)"></div>
    <div class="abs ui" style="left:110px;top:120px;font-size:64px;color:var(--text)">👁 VISUALIZAÇÕES</div>
    <div class="abs disp" style="left:90px;top:210px;font-size:640px">70</div>
    <svg class="abs" style="left:110px;top:800px" width="980" height="180" viewBox="0 0 980 180">
      <path d="M0 170 C 80 100, 140 40, 260 24 S 600 14, 980 14" fill="none" stroke="#22e07a" stroke-width="22" stroke-linecap="round"/>
    </svg>
    <div class="abs disp" style="left:1010px;top:80px;font-size:225px;transform:rotate(-4deg);background:var(--accent);color:var(--bg);padding:10px 40px 26px;border-radius:24px">TRAVOU?</div>
    <img class="abs" src="mascote.png" style="left:1140px;top:400px;width:720px;height:720px;border-radius:50%;border:14px solid var(--accent)">
  </div>

  <!-- Opção B: frase + escada quebrada + mascote -->
  <div class="op" id="B">
    <div class="abs disp" style="left:90px;top:90px;font-size:300px">O YOUTUBE</div>
    <div class="abs disp ac" style="left:90px;top:360px;font-size:300px">MUDOU.</div>
    <div class="abs" style="left:100px;top:700px;display:flex;gap:26px;align-items:flex-end">
      <div class="disp" style="font-size:230px;background:var(--surface);padding:10px 36px;border-radius:24px">70</div>
      <div class="ui" style="font-size:70px;color:var(--text);line-height:1.05;margin-bottom:24px">views e<br><span class="ac">travou?</span></div>
    </div>
    <img class="abs" src="mascote.png" style="left:1190px;top:370px;width:680px;height:680px;border-radius:50%;border:14px solid var(--accent)">
  </div>

</div>
<script>
window.seek = function (t) {
  document.getElementById("A").style.display = t < 0.5 ? "block" : "none";
  document.getElementById("B").style.display = t >= 0.5 ? "block" : "none";
};
window.seek(0);
</script></body></html>
