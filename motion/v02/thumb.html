<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Thumbnail v02</title>
<!-- Thumbnail do vídeo 2 (1920x1080, reduzida para 1280x720). seek(t): t=0 -> opção A, t=1 -> opção B. -->
<style>
  :root { --bg:#0e1114; --surface:#171b21; --sup:#20262e; --line:#2a3038; --text:#f2f4f6; --muted:#8a939e; --accent:#22e07a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
           background-image: radial-gradient(circle, #232a32 3px, transparent 3.4px); background-size: 64px 64px; }
  .op { position: absolute; inset: 0; display: none; }
  .disp { font-family: "Bahnschrift", sans-serif; font-weight: 700; font-stretch: condensed; font-variation-settings: "wght" 700, "wdth" 75; line-height: 0.88; color: var(--text); white-space: nowrap; }
  .ui { font-family: "Segoe UI", sans-serif; font-weight: 800; }
  .abs { position: absolute; }
  .jan { position: absolute; border-radius: 30px; background: var(--surface); overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  .barra { height: 70px; background: #1f252c; display: flex; align-items: center; gap: 14px; padding: 0 28px; }
  .barra i { width: 20px; height: 20px; border-radius: 10px; background: #3a414b; display: block; }
  .barra.ativa { background: var(--accent); }
  .barra.ativa i { background: rgba(14,17,20,.35); }
  .selo { position: absolute; font-family: "Bahnschrift"; font-weight: 700; color: var(--bg); background: var(--accent); border-radius: 20px; padding: 6px 30px 14px; }
</style></head>
<body><div id="stage">

  <!-- Opção A: duas thumbs (lotada ✗ x limpa ✓) + "1 SEGUNDO." -->
  <div class="op" id="A">
    <div class="jan" style="left:70px;top:330px;width:760px;height:520px;transform:rotate(-4deg)">
      <div class="barra"><i></i><i></i><i></i></div>
      <div style="position:relative;margin:24px;height:400px;border-radius:18px;background:#2a2f36;overflow:hidden">
        <div class="disp" style="position:absolute;left:20px;top:16px;font-size:58px;color:#59606a;white-space:normal;width:690px;line-height:1">COMO FAZER MUITAS COISAS NO SEU CANAL E TER MAIS VIEWS RÁPIDO 2026 TUTORIAL COMPLETO</div>
      </div>
      <div class="abs disp" style="left:250px;top:120px;font-size:400px;color:#ff5a5a00;-webkit-text-stroke:0">&nbsp;</div>
    </div>
    <div class="abs disp" style="left:300px;top:420px;font-size:380px;color:#f2f4f6;opacity:.92;transform:rotate(-4deg)">✗</div>
    <div class="jan" style="left:880px;top:280px;width:860px;height:600px;transform:rotate(3deg);outline:12px solid var(--accent)">
      <div class="barra ativa"><i></i><i></i><i></i></div>
      <div style="position:relative;margin:26px;height:470px;border-radius:20px;background:#0e1114;overflow:hidden">
        <img src="mascote.png" style="position:absolute;left:30px;top:40px;width:400px;height:400px;border-radius:50%">
        <div class="disp" style="position:absolute;left:450px;top:110px;font-size:170px;color:var(--accent)">3<br><span style="color:var(--text);font-size:84px">PALAVRAS</span></div>
      </div>
    </div>
    <div class="abs disp" style="left:1500px;top:820px;font-size:240px;color:var(--accent);transform:rotate(8deg);text-shadow:0 10px 40px rgba(0,0,0,.6)">✓</div>
    <div class="selo" style="left:70px;top:60px;font-size:190px;transform:rotate(-3deg)">1 SEGUNDO.</div>
  </div>

  <!-- Opção B: celular com thumb do tamanho de um selo + mascote apontando -->
  <div class="op" id="B">
    <!-- personagem de capuz à esquerda, apontando para o texto; bordas fundidas no fundo -->
    <img class="abs" src="capuz.jpg" style="left:-130px;top:0;width:1080px;height:1080px;
         -webkit-mask-image:radial-gradient(ellipse 52% 62% at 50% 52%, #000 62%, transparent 100%);">
    <div class="abs disp" style="left:930px;top:90px;font-size:215px">SUA THUMB</div>
    <div class="abs disp" style="left:930px;top:315px;font-size:215px;color:var(--accent)">É ASSIM.</div>
    <div class="jan" style="left:940px;top:610px;width:880px;height:300px">
      <div class="barra ativa"><i></i><i></i><i></i></div>
      <div style="display:flex;align-items:center;gap:40px;padding:30px 40px">
        <div style="width:150px;height:84px;border-radius:10px;background:#0e1114;outline:6px solid var(--accent);flex:none"></div>
        <div class="ui" style="font-size:62px;color:var(--text);line-height:1.05">no celular:<br><span style="color:var(--accent)">um selo.</span></div>
      </div>
    </div>
  </div>

</div>
<script>
window.seek = function (t) {
  document.getElementById("A").style.display = t < 0.5 ? "block" : "none";
  document.getElementById("B").style.display = t >= 0.5 ? "block" : "none";
};
window.seek(0);
</script></body></html>
