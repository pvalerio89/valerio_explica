<script>

const TP=window.TEMPOS, PAL=window.PAL.palavras;

function T(b,f){const B=TP.blocos.find(x=>x.n===b);return B.inicio_global+B.frases[f].ini;}
function TF(b,f){const B=TP.blocos.find(x=>x.n===b);return B.inicio_global+B.frases[f].fim;}
function W(b,f,word,nth=0){const ws=PAL.filter(p=>p.b===b&&p.f===f);const n=norm(word);let c=0;
  for(const p of ws){if(norm(p.w).startsWith(n)){if(c===nth)return p.ini;c++;}}
  console.log('palavra nao achada',b,f,word);return T(b,f)+0.3;}

const world=document.getElementById('world');
const tl=gsap.timeline({paused:true});
const E='power3.inOut';
let panels=[];
function panel(){const p=document.createElement('div');p.className='panel';p.style.left=(panels.length*1920)+'px';world.appendChild(p);panels.push(p);return p;}
let uid=0;
function add(P,html,css,cls=''){const d=document.createElement('div');d.id='e'+(uid++);d.className=cls;d.style.cssText='position:absolute;'+css;d.innerHTML=html;P.appendChild(d);return '#'+d.id;}
// animações de entrada
const A={
 up:(s,t)=>tl.from(s,{y:50,opacity:0,duration:0.45,ease:'power3.out'},t),
 pop:(s,t)=>tl.from(s,{scale:0.6,opacity:0,duration:0.45,ease:'back.out(1.8)'},t),
 fade:(s,t)=>tl.from(s,{opacity:0,duration:0.4},t),
 left:(s,t)=>tl.from(s,{x:-60,opacity:0,duration:0.45,ease:'power3.out'},t),
 stamp:(s,t)=>tl.from(s,{scale:2.2,opacity:0,duration:0.22,ease:'power4.in'},t),
};
const ICON=(k,sz)=>`<div style="width:${sz}px;height:${sz}px">${I[k]}</div>`;
const CX=1320; // centro da área de conteúdo
function title(P,txt,t,y=120,size=86){return add(P,`<div class="h" style="font-size:${size}px;text-align:center">${txt}</div>`,`left:780px;width:1080px;top:${y}px`), A.up('#e'+(uid-1),t);}
function chip(P,txt,x,y,t,cls='',an='pop'){const s=add(P,txt,`left:${x}px;top:${y}px`,'chip '+cls);A[an](s,t);return s;}
function stamp(P,txt,x,y,t,rot=-8,cls=''){const s=add(P,txt,`left:${x}px;top:${y}px;transform:rotate(${rot}deg)`,'stamp '+cls);A.stamp(s,t);return s;}
function card(P,html,x,y,w,h,t,an='up',extra=''){const s=add(P,html,`left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}`,'card');A[an](s,t);return s;}
function vidCard(P,x,y,t,w=280,ic=null){return card(P,`<div style="position:absolute;left:14px;top:14px;right:14px;height:${w*0.45}px;border-radius:12px;background:#ece5d6;display:flex;align-items:center;justify-content:center">${ic?ICON(ic,w*0.24):'<div style="border-left:24px solid #b9ae98;border-top:14px solid transparent;border-bottom:14px solid transparent"></div>'}</div><div class="bar" style="position:absolute;left:14px;top:${w*0.45+30}px;width:60%"></div><div class="bar" style="position:absolute;left:14px;top:${w*0.45+54}px;width:40%"></div>`,x,y,w,w*0.45+84,t);}
