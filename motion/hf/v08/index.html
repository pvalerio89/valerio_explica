const TP=window.TEMPOS, PAL=window.PAL.palavras;

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function T(b,f){const B=TP.blocos.find(x=>x.n===b);return B.inicio_global+B.frases[f].ini;}
function TF(b,f){const B=TP.blocos.find(x=>x.n===b);return B.inicio_global+B.frases[f].fim;}
function W(b,f,word,nth=0){const ws=PAL.filter(p=>p.b===b&&p.f===f);const n=norm(word);let c=0;
  for(const p of ws){if(norm(p.w).startsWith(n)){if(c===nth)return p.ini;c++;}}
  console.log('palavra nao achada',b,f,word);return T(b,f)+0.3;}

/* ---------- construção ---------- */
const world=document.getElementById('world');
const tl=gsap.timeline({paused:true});
const E='power3.inOut';
let panels=[];
function panel(){const p=document.createElement('div');p.className='panel';p.style.left=(panels.length*1920)+'px';world.appendChild(p);panels.push(p);return p;}
let uid=0;
function add(P,html,css,cls=''){const d=document.createElement('div');d.id='e'+(uid++);d.className=cls;d.style.cssText='position:absolute;'+css;d.innerHTML=html;P.appendChild(d);return '#'+d.id;}
// sons: cada animação registra um evento; o script de áudio lê window.EVENTOS
const EVENTOS=[];function EV(t,k,g=1){EVENTOS.push([+t.toFixed(3),k,g]);}
const A={
 up:(s,t)=>{EV(t,'up');return tl.from(s,{y:50,opacity:0,duration:0.45,ease:'power3.out'},t);},
 pop:(s,t)=>{EV(t,'pop');return tl.from(s,{scale:0.6,opacity:0,duration:0.45,ease:'back.out(1.8)'},t);},
 fade:(s,t)=>tl.from(s,{opacity:0,duration:0.4},t),
 left:(s,t)=>{EV(t,'up',0.6);return tl.from(s,{x:-60,opacity:0,duration:0.45,ease:'power3.out'},t);},
 drop:(s,t)=>{EV(t+0.3,'impacto',0.6);return tl.from(s,{y:-160,opacity:0,duration:0.55,ease:'bounce.out'},t);},
 stamp:(s,t)=>{EV(t+0.2,'impacto');return tl.from(s,{scale:2.2,opacity:0,duration:0.22,ease:'power4.in'},t);},
};
const ICON=(k,sz)=>`<div style="width:${sz}px;height:${sz}px;flex:none">${I[k]}</div>`;
function title(P,txt,t,y=110,size=80){const s=add(P,`<div class="h" style="font-size:${size}px;text-align:center">${txt}</div>`,`left:780px;width:1100px;top:${y}px`);A.up(s,t);return s;}
function chip(P,txt,x,y,t,cls='',an='pop'){const s=add(P,txt,`left:${x}px;top:${y}px`,'chip '+cls);A[an](s,t);return s;}
function stamp(P,txt,x,y,t,rot=-8,cls='',fs=60){const s=add(P,txt,`left:${x}px;top:${y}px;transform:rotate(${rot}deg);font-size:${fs}px`,'stamp '+cls);A.stamp(s,t);return s;}
function card(P,html,x,y,w,h,t,an='up',extra=''){const s=add(P,html,`left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}`,'card');A[an](s,t);return s;}
function fonte(P,txt,t,y=852){const s=add(P,`<b>i</b>${txt}`,`left:800px;top:${y}px`,'fonte');A.fade(s,t);return s;}
function row(P,mk,txt,x,y,t,cls='ok',fs=44){const s=add(P,`<div class="row" style="font-size:${fs}px"><div class="mk ${cls}">${mk}</div><div>${txt}</div></div>`,`left:${x}px;top:${y}px`);A.left(s,t);return s;}
// contadores de número (puros no tempo, atualizados em vivo())
const NUM=[];const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function conta(id,t0,t1,a,b,suf=''){NUM.push({id,t0,t1,a,b,suf});for(let k=0;k<8;k++)EV(t0+(t1-t0)*k/8,'tick',0.5);}
// moedas caindo em loop (fim definido)
function chuva(P,x,y,t0,t1,dist=150,per=0.6,n=3){for(let k=0;k<n;k++){const c=add(P,I.moeda,`left:${x+(k%2)*14-7}px;top:${y}px;width:44px;height:44px;opacity:0`);
  const st=t0+k*per/n,rep=Math.max(0,Math.floor((t1-st)/per)-1);
  tl.fromTo(c,{y:0,opacity:1},{y:dist,opacity:0,duration:per,ease:'power1.in',repeat:rep,immediateRender:false},st);}}
// fórmula views ÷ 1.000 × RPM = R$
function formula(P,x,y,t,rev){const k=uid++;
  const pcs=[['views',''],['1.000',''],['RPM','color:#149a55'],['R$','']];const L=[25,315,605,895],O=[250,540,830],ops=['÷','×','='];
  let h=`<div class="tag" style="position:absolute;left:30px;top:24px">a conta inteira</div>`;
  pcs.forEach(([v,c],i)=>h+=`<div class="pc" id="pc${k}_${i}" style="left:${L[i]}px;${i===3?'width:180px':''}"><div class="q">?</div><div class="v" style="${c}">${v}</div></div>`);
  O.forEach((l,i)=>h+=`<div class="op" style="left:${l}px">${ops[i]}</div>`);
  const s=card(P,h,x,y,1100,320,t);
  if(rev)rev.forEach((tt,i)=>{const p='#pc'+k+'_'+i;EV(tt,'clique');
    tl.to(p,{scaleX:0,duration:0.1,ease:'power2.in'},tt);
    tl.set(p+' .q',{opacity:0},tt+0.1);tl.set(p+' .v',{opacity:1},tt+0.1);
    tl.set(p,{background:'#fffdf8',borderStyle:'solid',borderColor:i===2?'#149a55':'#d8cfbe'},tt+0.1);
    tl.to(p,{scaleX:1,duration:0.14,ease:'back.out(2)'},tt+0.1);});
  else tl.to(`#pc${k}_0 .q,#pc${k}_1 .q,#pc${k}_2 .q,#pc${k}_3 .q`,{rotation:12,duration:0.12,yoyo:true,repeat:5,stagger:0.05},t+0.6);
  return {s,k};}

function calendario(P,x,y,w,t,an='pop'){const h=w*1.1;return card(P,`<div style="position:absolute;left:0;right:0;top:0;height:${h*0.25}px;background:${R};border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:center;color:#fff" class="h"><span style="font-size:${w*0.14}px;letter-spacing:4px">FEV</span></div>

function arm(pose,t,d=0.5){const r={down:55,point:-8,up:-45,mid:20,coca:-80}[pose];tl.to('#arm',{rotation:r,svgOrigin:'865 485',duration:d,ease:pose==='down'?E:'back.out(1.8)'},t);}
function surpresa(t){tl.to('#sobr',{y:-12,duration:0.18},t).to('#sobr',{y:0,duration:0.3},t+1.1);}
function inclina(t,r=-6){tl.to('#head',{rotation:r,svgOrigin:'760 440',duration:0.4,ease:'sine.inOut'},t).to('#head',{rotation:0,svgOrigin:'760 440',duration:0.5,ease:'sine.inOut'},t+1.4);}

const BUB=[];function balao(t,txt,dur=2.2,cor=K){BUB.push([t,txt,cor]);EV(t,'pop',0.7);tl.fromTo('#bubble',{opacity:0,scale:0.7,svgOrigin:'640 260'},{opacity:1,scale:1,svgOrigin:'640 260',duration:0.3,ease:'back.out(2)',immediateRender:false},t);tl.to('#bubble',{opacity:0,duration:0.25},t+dur);}
function troca(t,txt,cor=K){BUB.push([t,txt,cor]);tl.to('#bubble',{scale:1.1,svgOrigin:'640 260',duration:0.12,yoyo:true,repeat:1},t);}
function joinha(t,d=2){tl.set('#finger',{opacity:0},t);tl.set('#thumb',{opacity:1},t);arm('mid',t,0.4);tl.set('#finger',{opacity:1},t+d);tl.set('#thumb',{opacity:0},t+d);arm('down',t+d,0.45);}
function objeto(id,t,d,pose='mid'){tl.set('#finger',{opacity:0},t);tl.set(id,{opacity:1},t);arm(pose,t,0.45);tl.set(id,{opacity:0},t+d);tl.set('#finger',{opacity:1},t+d);}
function coca(t,d=2.4){arm('coca',t,0.55);tl.to('#arm',{rotation:-74,svgOrigin:'865 485',duration:0.14,yoyo:true,repeat:Math.floor(d/0.14)|1,ease:'sine.inOut'},t+0.55);
  tl.to('#head',{rotation:6,svgOrigin:'760 440',duration:0.4,ease:'sine.inOut'},t).to('#head',{rotation:0,svgOrigin:'760 440',duration:0.4},t+d+0.5);arm('down',t+d+0.6);}
function dedo(t,d=1.6){arm('up',t,0.4);tl.to('#arm',{rotation:-32,svgOrigin:'865 485',duration:0.16,yoyo:true,repeat:Math.floor(d/0.16)|1,ease:'sine.inOut'},t+0.4);arm('down',t+d+0.5);}
function alerta(t,d=2){arm('up',t,0.4);tl.to('#sobr',{y:-12,duration:0.18},t).to('#sobr',{y:0,duration:0.3},t+d);suor(t+0.2);arm('down',t+d);}
tl.set('#arm',{rotation:55,svgOrigin:'865 485'},0);

function nova(t){const P=panel();go(t);return P;}

const FR=[];TP.blocos.forEach(B=>B.frases.forEach((F,fi)=>{const all=PAL.filter(p=>p.b===B.n&&p.f===fi);if(!all.length)return;
  const n=Math.ceil(all.length/9),per=Math.ceil(all.length/n);
  for(let c=0;c<n;c++){const ws=all.slice(c*per,(c+1)*per);if(!ws.length)continue;
  const d=document.createElement('div');d.className='ph';ws.forEach(p=>{const s=document.createElement('span');s.textContent=p.w.replace(/^"|"$/g,'');const k=norm(p.w);if(VERDE.has(k))s.className='g';if(VERM.has(k))s.className='r';d.appendChild(s);});
  const nx=all[(c+1)*per];leg.appendChild(d);FR.push({el:d,ini:c===0?B.inicio_global+F.ini:ws[0].ini,fim:nx?nx.ini-0.26:B.inicio_global+F.fim,ws,spans:[...d.children]});}}));

/* ---------- respiração / piscar / números (função do tempo) ---------- */
const BLINK=[];for(let b=1.3;b<DUR;b+=3.1+((b*7)%1.7))BLINK.push(b);
const MO=['m0','m1','m2','m3'].map(id=>document.getElementById(id));
const guy=document.getElementById('guy'),eyes=document.getElementById('eyes');
const bubT=document.getElementById('bubbleTxt');
const NUME=NUM.map(n=>({...n,el:document.getElementById(n.id)}));
const NBY={};for(const n of NUME)(NBY[n.id]=NBY[n.id]||[]).push(n);
function vivo(t){
  let bt='?',bc=K;for(const [a,x,c] of BUB){if(t>=a){bt=x;bc=c;}}if(bubT.textContent!==bt)bubT.textContent=bt;bubT.setAttribute('fill',bc);
  for(const id in NBY){const L=NBY[id];let n=L[0];for(const x of L)if(t>=x.t0)n=x;const p=Math.min(1,Math.max(0,(t-n.t0)/Math.max(0.01,n.t1-n.t0)));const v=n.a+(n.b-n.a)*p*p;n.el.textContent=fmt(v)+n.suf;}
  let cur=null;for(const f of FR){const on=t>=f.ini-0.05&&t<f.fim+0.25&&!(cur);if(on)cur=f;f.el.style.display=on?'block':'none';}
  if(cur)cur.ws.forEach((p,i)=>{cur.spans[i].style.opacity=t>=p.ini?1:0;});
  let w=null;for(const p of PAL){if(t>=p.ini&&t<p.fim){w=p;break;}}
  let m=0;if(w){const k=Math.floor((t-w.ini)/0.11);m=[1,2,1,0][k%4];if(w.fim-w.ini<0.12)m=2;}
  MO.forEach((e,i)=>e.setAttribute('opacity',i===m?1:0));
  guy.setAttribute('transform',`translate(0 ${(-3-3*Math.sin(t*2*Math.PI/1.8)).toFixed(2)})`);
  let sy=1;for(const b of BLINK){if(t>=b&&t<b+0.16){sy=0.12;break;}}
  eyes.setAttribute('transform',`translate(0 ${330*(1-sy)}) scale(1 ${sy})`);
}
